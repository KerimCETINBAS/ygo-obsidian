name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' must match manifest.json version '$version'."
            exit 1
          fi

      - name: Build plugin
        run: |
          npm ci
          npm test
          npm run build

      - name: Pack the plugin folder
        run: |
          mkdir -p pack/ygo-combo-builder
          cp dist/main.js dist/manifest.json dist/styles.css pack/ygo-combo-builder/
          (cd pack && zip -r ../dist/ygo-combo-builder.zip ygo-combo-builder)

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/ygo-combo-builder.zip
            AI.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes "$(cat <<EOF
          Obsidian installs from the separate \`main.js\`, \`manifest.json\`, and \`styles.css\` assets.

          \`ygo-combo-builder.zip\` is the same three files inside a \`ygo-combo-builder\` folder, for a manual copy into \`.obsidian/plugins/\`.

          The Source code links on this release are empty on purpose. Read the source in the repository.

          \`AI.md\` is the agent catalog. Give that file to an agent, or point a filesystem tool at it.
          EOF
          )" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css \
            dist/ygo-combo-builder.zip \
            AI.md
